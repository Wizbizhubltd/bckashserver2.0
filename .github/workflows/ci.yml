name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BCKash.slnx

      - name: Check formatting
        run: dotnet format BCKash.slnx --verify-no-changes

      - name: Build
        run: dotnet build BCKash.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test BCKash.slnx --no-build --configuration Release --logger "console;verbosity=normal"
