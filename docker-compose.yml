# Shared log limits: each container keeps at most 3 x 50MB of logs, so a noisy service can never
# fill the disk again (the API once wrote a 45GB log in under a week).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  db:
    # MariaDB, matching production (MariaDB 11.4).
    image: mariadb:11.4
    restart: unless-stopped
    # InnoDB's in-memory cache. The 128M default is far smaller than the working set
    # (loan_repayment_schedules alone is ~1.2GB with indexes), so dashboard/report queries hit
    # disk on every row. 1G suits a 4GB host that also runs the API and Redis; raise it on a
    # bigger box via DB_BUFFER_POOL_SIZE.
    command: ["--innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-1G}"]
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - bckash-mariadb-data:/var/lib/mysql
    logging: *default-logging
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache only: no RDB snapshots, no AOF and no data volume, so Redis never writes to disk. A
    # failed snapshot (disk nearly full, low memory) makes Redis refuse all writes, which breaks
    # every query through the EF second-level cache — including login. maxmemory + allkeys-lru
    # keeps it bounded on the shared 4GB host by evicting least-recently-used entries.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
              "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: BCKash.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Keep app logs at Information, but silence framework noise. EF Core at Information logs
      # the full SQL of every query, which is what filled the disk.
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # Overrides the .env values to reach MariaDB/Redis over the docker network (service names
      # `db`/`redis`, their internal ports) instead of the host-mapped ports .env uses for
      # `dotnet run` outside docker.
      ConnectionStrings__BCKashDb: "Server=db;Port=3306;Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
    logging: *default-logging
    ports:
      # Loopback only: on the server nginx proxies to 127.0.0.1:4000, and the API shouldn't be
      # reachable from outside except through it. Keep API_PORT a bare port number — the seed
      # script builds http://localhost:$API_PORT/ from it.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bckash-uploads:/app/App_Data/uploads

volumes:
  bckash-mariadb-data:
  bckash-uploads: