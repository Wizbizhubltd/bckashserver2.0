services:
  db:
    # MariaDB, matching production (MariaDB 11.4).
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - bckash-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - bckash-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: BCKash.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env values to reach MariaDB/Redis over the docker network (service names
      # `db`/`redis`, their internal ports) instead of the host-mapped ports .env uses for
      # `dotnet run` outside docker.
      ConnectionStrings__BCKashDb: "Server=db;Port=3306;Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
    ports:
      # Loopback only: on the server nginx proxies to 127.0.0.1:4000, and the API shouldn't be
      # reachable from outside except through it. Keep API_PORT a bare port number — the seed
      # script builds http://localhost:$API_PORT/ from it.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bckash-uploads:/app/App_Data/uploads

volumes:
  bckash-mariadb-data:
  bckash-uploads:
  bckash-redis-data:
